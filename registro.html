<!DOCTYPE html>
<html lang="es-CL">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica NutriVida</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/funciones.js" defer></script>
</head>

<body>
  <header>
    <div class="contenedor-titulo">
      <img src="img/logo.png" alt="logo" class="logo">
      <h1>CLÍNICA NUTRICIONAL NUTRIVIDA</h1>
    </div>
    <nav>
      <ul>
        <button class="hamburguesa" id="hamburguesa">&#9776;</button>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Nosotros</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>

      <div class="botones-nav">
        <a href="iniciar-sesion.html">
          <button class="boton-iniciar-sesion">Iniciar Sesión</button>
        </a>
        
      </div>
    </nav>
  </header>

  

  <form id="formulario-registro" novalidate>

    <h2>Crear cuenta</h2>

    <div class="grupo-input">
        <label for="run">RUN</label>
        <input type="text" id="run" placeholder="Ej: 19011022K" required>
        <span id="error-run"></span>
    </div>

    <div class="grupo-input">
        <label for="nombre">Nombres</label>
        <input type="text" id="nombre" placeholder="Ej: Juan Pablo">
        <span id="error-nombre"></span>
    </div>

    <div class="grupo-input">
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" placeholder="Ej: García López" required>
        <span id="error-apellidos"></span>
    </div>

    <div class="grupo-input">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="ejemplo@duoc.cl" required>
        <span id="error-correo"></span>
    </div>

    <div class="grupo-input">
        <label for="confirmar-correo">Confirmar correo electrónico</label>
        <input type="email" id="confirmar-correo" placeholder="Repite tu correo" required>
        <span id="error-confirmar-correo"></span>
    </div>

    <div class="grupo-input">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" placeholder="Mínimo 8 caracteres" required>
        <span id="error-contrasena"></span>
    </div>

    <div class="grupo-input">
        <label for="confirmar-contrasena">Confirmar contraseña</label>
        <input type="password" id="confirmar-contrasena" placeholder="Repite tu contraseña" required>
        <span id="error-confirmar-contrasena"></span>
    </div>

    <div class="grupo-input">
        <label for="telefono">Teléfono (opcional)</label>
        <input type="tel" id="telefono" placeholder="+56 9 1234 5678">
    </div>

    <div class="grupo-input">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" placeholder="Ej: Calle 123, Temuco" required>
        <span id="error-direccion"></span>
    </div>

    <div class="grupo-input">
        <label for="rol">Rol</label>
        <select id="rol" required>
            <option value="">Selecciona un rol</option>
            <option value="administrador">Administrador</option>
            <option value="nutricionista">Nutricionista</option>
            <option value="paciente">Paciente</option>
        </select>
        <span id="error-rol"></span>
    </div>

    <button type="submit" class="boton-registro">Registrarse</button>

</form>

  <span id="confirmacion"></span>

</body>

</html>
