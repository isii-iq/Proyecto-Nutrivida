<!DOCTYPE html>
<html lang="es-CL">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica NutriVida</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/funciones.js" defer></script>
</head>

<body>
  <header>
    <div class="contenedor-titulo">
      <img src="img/logo.png" alt="logo" class="logo">
      <h1>CLÍNICA NUTRICIONAL NUTRIVIDA</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Nosotros</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>

      <a href="registro.html">
        <button class="boton-registro">Registrarse</button>
      </a>

    </nav>
  </header>

  <h2>Iniciar sesión</h2>

  <form id="formulario-iniciar-sesion" novalidate>

    <label for="correo">Correo electrónico</label><br>
    <input type="email" id="correo" placeholder="Ej: juan@duoc.cl" required><br>
    <span id="error-correo"></span><br>

    <label for="contrasena">Contraseña</label><br>
    <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required><br>
    <span id="error-contrasena"></span><br>

    <label for="rol">Rol</label><br>
    <select id="rol" required>
      <option value="">Selecciona un rol</option>
      <option value="administrador">Administrador</option>
      <option value="nutricionista">Nutricionista</option>
      <option value="paciente">Paciente</option>
    </select><br>
    <span id="error-rol"></span><br><br>

    <button type="submit">Iniciar Sesión</button>

  </form>

  <span id="confirmacion"></span>

</body>

</html>
